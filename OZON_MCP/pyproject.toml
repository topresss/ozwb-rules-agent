[project]
name = "ozon-mcp"
version = "0.1.1"
description = "面向 Ozon 卖家的知识型 MCP Server，内置 API 方法、业务工作流和中文运营知识库"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "ozon", "marketplace", "ai-agents", "claude", "openapi", "seller-api", "knowledge-base", "bm25", "chinese", "ecommerce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "rank-bm25>=0.2.2",
    "structlog>=24.4.0",
    "networkx>=3.3",
    "pyyaml>=6.0.2",
    "snowballstemmer>=2.2.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "aiolimiter>=1.1.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.32.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml",
    "types-jsonschema",
]

[project.scripts]
ozon-mcp = "ozon_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/yifan4243-sketch/OZON_MCP"
Repository = "https://github.com/yifan4243-sketch/OZON_MCP"
Issues = "https://github.com/yifan4243-sketch/OZON_MCP/issues"
Changelog = "https://github.com/yifan4243-sketch/OZON_MCP/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/ozon_mcp/data/seller_swagger.json" = "ozon_mcp/data/seller_swagger.json"
"src/ozon_mcp/data/perf_swagger.json" = "ozon_mcp/data/perf_swagger.json"
"src/ozon_mcp/data/swagger_meta.json" = "ozon_mcp/data/swagger_meta.json"
"src/ozon_mcp/knowledge/workflows.yaml" = "ozon_mcp/knowledge/workflows.yaml"
"src/ozon_mcp/knowledge/rate_limits.yaml" = "ozon_mcp/knowledge/rate_limits.yaml"
"src/ozon_mcp/knowledge/error_codes.yaml" = "ozon_mcp/knowledge/error_codes.yaml"
"src/ozon_mcp/knowledge/quirks.yaml" = "ozon_mcp/knowledge/quirks.yaml"
"src/ozon_mcp/knowledge/examples.yaml" = "ozon_mcp/knowledge/examples.yaml"
"src/ozon_mcp/knowledge/safety_overrides.yaml" = "ozon_mcp/knowledge/safety_overrides.yaml"
"src/ozon_mcp/knowledge/subscription_overrides.yaml" = "ozon_mcp/knowledge/subscription_overrides.yaml"
"src/ozon_mcp/knowledge/deprecated_methods.yaml" = "ozon_mcp/knowledge/deprecated_methods.yaml"
"src/ozon_mcp/knowledge/pagination_patterns.yaml" = "ozon_mcp/knowledge/pagination_patterns.yaml"
"src/ozon_mcp/knowledge/descriptions_overrides.yaml" = "ozon_mcp/knowledge/descriptions_overrides.yaml"
"src/ozon_mcp/operations_knowledge/data/manifest.yaml" = "ozon_mcp/operations_knowledge/data/manifest.yaml"
"src/ozon_mcp/operations_knowledge/data/chunks.jsonl" = "ozon_mcp/operations_knowledge/data/chunks.jsonl"
"src/ozon_mcp/operations_knowledge/data/topics.json" = "ozon_mcp/operations_knowledge/data/topics.json"
"src/ozon_mcp/operations_knowledge/data/ozon_operations_knowledge.md" = "ozon_mcp/operations_knowledge/data/ozon_operations_knowledge.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Russian-language test fixtures and docstrings legitimately contain Cyrillic
# letters that visually overlap with Latin (с / s). Suppress the ambiguous-
# unicode rule for tests where this is intentional.
"tests/**" = ["RUF001"]
# Chinese docstrings, comments, and string literals legitimately contain
# fullwidth punctuation (colon, comma, parentheses).
"src/ozon_mcp/tools/operations_knowledge.py" = ["RUF001", "RUF002"]
"src/ozon_mcp/server.py" = ["RUF001"]
"scripts/export_methods.py" = ["RUF001", "RUF003"]
"scripts/generate_subscription_overrides.py" = ["RUF001"]
"src/ozon_mcp/operations_knowledge/loader.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/golden", "tests/integration"]
addopts = "--tb=short"
markers = [
    "live: tests requiring real Ozon API credentials (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
source = ["src/ozon_mcp"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
