name: Sync OZON_MCP Upstream
on:
  workflow_dispatch: # 👉 这个就是【网页手动点击运行】按钮
  # schedule:
  #   - cron: '0 2 * * *' # 可选：每天UTC凌晨2点自动同步，不需要就注释掉

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须，才能提交代码推回仓库
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run your sync script
        run: |
          chmod +x ./OZON_MCP/sync-upstream.sh
          ./OZON_MCP/sync-upstream.sh

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add OZON_MCP/
          if git diff --staged --quiet; then
            echo "✅ No changes to sync"
          else
            git commit -m "sync: auto update OZON_MCP from upstream wbcyclist/OZON_MCP"
            git push
          fi
